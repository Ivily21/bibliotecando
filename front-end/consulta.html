<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Bibliotecando - Acervo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="nav-link">CADASTRO</a>
            <a href="consulta.html" class="nav-link" style="border-color: #4f46e5;">CONSULTA / ACERVO</a>
        </nav>
    </header>

    <div class="logo-box" style="justify-content: center; margin-top: 20px;">
        <img src="Group 5.svg" alt="Logo">
        <h2>ACERVO DA BIBLIOTECA</h2>
    </div>

    <div class="search-container">
        <img src="Vector.svg" alt="Lupa">
        <input type="text" id="inputBusca" onkeyup="filtrarLivros()" placeholder="Pesquisar por título ou autor">
    </div>

    <table>
        <thead>
            <tr>
                <th>TÍTULO</th>
                <th>AUTOR</th>
                <th>ANO</th>
                <th>AÇÕES</th>
            </tr>
        </thead>
        <tbody id="tabela-livros">
            </tbody>
    </table>

    <script src="script.js"></script>
    <script>
        // Garante que os livros carreguem assim que abrir a página
        window.onload = carregarLivros;
    </script>
</body>
</html>
